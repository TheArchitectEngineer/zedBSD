# zedBSD persistent network configuration.
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  # USB wired adapters (CDC-ECM, CDC-NCM: ue0, ue1) take an address by DHCP
  # when a cable is in (2026-09-29 user decision), so a machine can be reached
  # over the wire without typing on its console.
  ue0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: true
  ue1:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: true

dns:
  mode: dhcp
