name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl git grub-common gzip ninja-build \
            mtools nasm patch xz-utils

      - name: Install pinned LLVM toolchain cache
        run: |
          make toolchain-cache
          make -j4 toolchain

      - name: Build intel-keiland
        run: |
          cp config/ci/config-amd64.mk config.mk
          yes | make firmware-licenses
          make -j4
          mkdir -p artifacts
          gzip -9 -c build/amd64/hdd-image.img > artifacts/zedbsd-intel.img.gz

      - name: Build intel-server
        run: |
          cp config/ci/config-amd64-server.mk config.mk
          yes | make firmware-licenses
          make -j4
          mkdir -p artifacts
          gzip -9 -c build/amd64/hdd-image.img > artifacts/zedbsd-intel-server.img.gz

      - name: Build pi4-keiland
        run: |
          cp config/ci/config-rpi4.mk config.mk
          yes | make firmware-licenses
          make -j4
          mkdir -p artifacts
          gzip -9 -c build/arm64/hdd-image.img > artifacts/zedbsd-rpi4.img.gz

      - name: Build pi4-server
        run: |
          cp config/ci/config-rpi4-server.mk config.mk
          yes | make firmware-licenses
          make -j4
          mkdir -p artifacts
          gzip -9 -c build/arm64/hdd-image.img > artifacts/zedbsd-rpi4-server.img.gz

      - name: Build pc98
        run: |
          cp config/ci/config-pc98.mk config.mk
          yes | make firmware-licenses
          make -j4
          mkdir -p artifacts
          gzip -9 -c build/pc98/hdd-image.img > artifacts/zedbsd-pc98.img.gz

      - name: Package zedbsd-qemu.zip
        continue-on-error: true
        run: |
          make kei-nightly-zip
          cp build/amd64/Kei-nightly.zip artifacts/zedbsd-qemu.zip

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            artifacts/*.img.gz
            artifacts/zedbsd-qemu.zip

  release:
    name: Create GitHub Release

    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    needs:
      - build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          prerelease: true

          body: |
            This is an automated nightly build. Not an official release.
            
            zedBSD OS
            =========
            
            | Image         | CPU     | Machine        | File                         | Description                                  |
            |---------------|---------|----------------|------------------------------|----------------------------------------------|
            | Intel Keiland | x86_64  | UEFI           | `zedbsd-intel.img.gz`        | USB image                                    |
            | Intel Server  | x86_64  | UEFI           | `zedbsd-intel-server.img.gz` | USB image                                    |
            | Pi4 Keiland   | Arm64   | Raspberry Pi 4 | `zedbsd-rpi4.img.gz`         | SD image                                     |
            | Pi4 Server    | Arm64   | Raspberry Pi 4 | `zedbsd-rpi4-server.img.gz`  | SD image                                     |
            | NEC PC-9800   | i386    | NEC PC-9800    | `zedbsd-pc98.img.gz`         | CF image                                     |
            | QEMU Win64    | x86_64  | Windows        | `zedbsd-qemu.zip`            | NVMe image with QEMU binary. Run `boot.bat`. |

          files: |
            artifacts/zedbsd-intel.img.gz
            artifacts/zedbsd-intel-server.img.gz
            artifacts/zedbsd-rpi4.img.gz
            artifacts/zedbsd-rpi4-server.img.gz
            artifacts/zedbsd-pc98.img.gz
            artifacts/zedbsd-qemu.zip
