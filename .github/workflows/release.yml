# The versioned release (ws129-p004; plan/ws129/release.md section 5).  The nightly build stays in ci.yml.
#
# An rc tag, zedbsd-<VERSION>-rc<N>, builds the release image from config/release/config-amd64-beta2.mk and
# publishes it as the Prerelease "Kei/zedBSD <name> RC <N>".  The final tag, zedbsd-<VERSION>, builds nothing:
# it takes the assets of the rc it promotes (the highest rc in its history, or the one named), checks them
# against their SHA256SUMS and publishes the same bytes as the Prerelease "Kei/zedBSD <name>", with the notes
# of the final tag's commit (which may differ from the rc's only under docs/release/).  The user then makes it
# the latest release by hand.  Neither path marks a release latest.
#
# The tag checks are tools/release/release-tag.sh; what the configuration says (the version, its name and
# whether the Windows zip is carried) is `make release-info`.  The notes are docs/release/zedbsd-<VERSION>.md.
name: Release

on:
  push:
    tags: [ 'zedbsd-*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag (zedbsd-VERSION-rcN to build, zedbsd-VERSION to promote)
        required: true
      from_rc:
        description: For a final tag, the number of the rc to promote (default the highest in its history)
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_CONFIG: config/release/config-amd64-beta2.mk

jobs:
  classify:
    name: Classify the tag
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.tag.outputs.kind }}
      rc: ${{ steps.tag.outputs.rc }}
      version: ${{ steps.tag.outputs.version }}
      name: ${{ steps.tag.outputs.name }}
      zip: ${{ steps.tag.outputs.zip }}
    steps:
      - name: Checkout the tag
        # A tag that does not exist fails here, so that no step makes one.
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Check the tag against VERSION
        id: tag
        run: |
          sh tools/release/release-tag.sh classify "$TAG" >> "$GITHUB_OUTPUT"
          make -s ZEDBSD_CONFIG="$RELEASE_CONFIG" release-info | grep -v '^version=' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build the rc
    needs: classify
    if: needs.classify.outputs.kind == 'build'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.classify.outputs.version }}
      ZIP: ${{ needs.classify.outputs.zip }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl git grub-common gzip ninja-build \
            mtools nasm patch xz-utils

      - name: Acquire verified source inputs
        run: make download

      - name: Install pinned LLVM toolchain cache
        run: |
          make toolchain-cache
          make -j4 toolchain

      - name: Check the licenses
        # An open item (a package without its license, an uncovered source, an undecided GPL component) stops
        # the release.  The index goes into the image as /usr/share/licenses/INDEX.
        run: |
          mkdir -p artifacts
          python3 tools/release/license-inventory.py --config "$RELEASE_CONFIG" \
            --markdown artifacts/LICENSES.md --index artifacts/INDEX

      - name: Build amd64
        run: |
          cp "$RELEASE_CONFIG" config.mk
          make -j4 ZEDBSD_EXTRA_INPUTS="$PWD/artifacts/INDEX" \
            ZEDBSD_EXTRA_FILES="--file /usr/share/licenses/INDEX=$PWD/artifacts/INDEX"
          python3 tools/release/license-inventory.py --config "$RELEASE_CONFIG" --rootfs build/amd64/rootfs
          gzip -9 -c build/amd64/hdd-image.img > "artifacts/zedbsd-$VERSION-amd64.img.gz"

      - name: Package the Windows zip
        # Only when the configuration carries it (ZEDBSD_RELEASE_ZIP, decision U6); then a draft base archive
        # is refused and a failure fails the release.
        if: env.ZIP == 'y'
        run: |
          make kei-nightly-zip KEI_NIGHTLY_ALLOW_DRAFT= \
            KEI_NIGHTLY_ZIP="$PWD/artifacts/zedbsd-$VERSION-windows.zip"

      - name: Check the sizes, sum the assets and take the notes
        run: |
          cd artifacts
          for asset in zedbsd-*; do
            size=$(stat -c %s "$asset")
            if [ "$size" -ge 2147483648 ]; then
              echo "release: $asset is $size bytes, over GitHub's 2 GiB" >&2
              exit 1
            fi
          done
          sha256sum zedbsd-* > SHA256SUMS
          cat SHA256SUMS
          notes="../docs/release/zedbsd-$VERSION.md"
          if [ ! -f "$notes" ]; then
            echo "release: no notes $notes" >&2
            exit 1
          fi
          cp "$notes" notes.md

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            artifacts/zedbsd-*
            artifacts/SHA256SUMS
            artifacts/LICENSES.md
            artifacts/notes.md

  publish:
    name: Publish the rc
    needs: [ classify, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NAME: ${{ needs.classify.outputs.name }}
      RC: ${{ needs.classify.outputs.rc }}
    steps:
      - name: Download the assets
        uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts

      - name: Create the Prerelease
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Kei/zedBSD $NAME RC $RC" --notes-file artifacts/notes.md \
            --prerelease --latest=false \
            artifacts/zedbsd-* artifacts/SHA256SUMS artifacts/LICENSES.md

  promote:
    name: Promote an rc
    needs: classify
    if: needs.classify.outputs.kind == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.classify.outputs.version }}
      NAME: ${{ needs.classify.outputs.name }}
      FROM_RC: ${{ inputs.from_rc }}
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Choose the rc and check it
        id: rc
        run: |
          rc=$(sh tools/release/release-tag.sh rc "$TAG" "$FROM_RC")
          sh tools/release/release-tag.sh promotable "$rc" "$TAG"
          echo "tag=$rc" >> "$GITHUB_OUTPUT"

      - name: Take the rc's assets
        env:
          RC_TAG: ${{ steps.rc.outputs.tag }}
        run: |
          mkdir assets
          gh release download "$RC_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          cd assets
          sha256sum -c SHA256SUMS
          test -f LICENSES.md

      - name: Create the Prerelease
        run: |
          notes="docs/release/zedbsd-$VERSION.md"
          test -f "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Kei/zedBSD $NAME" --notes-file "$notes" \
            --prerelease --latest=false \
            assets/*
