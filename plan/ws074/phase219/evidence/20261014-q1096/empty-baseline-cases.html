<!doctype html>
<style>
.grid { display: grid; grid: 100px 80px / 50px 50px 50px; align-items: baseline; }
.grid > div { width: 50px; }
.a { grid-row: 1; grid-column: 1; height: 20px; }
.b { grid-row: 1; grid-column: 2; height: 50px; }
.c { grid-row: 1; grid-column: 3; height: 30px; }
.d { grid-row: 2; grid-column: 1; height: 10px; }
.e { grid-row: 2; grid-column: 2; height: 40px; }
.f { grid-row: 2; grid-column: 3; height: 20px; align-self: end; }
</style>
<div class="grid"><div class="a"></div><div class="b"></div><div class="c"></div><div class="d"></div><div class="e"></div><div class="f"></div></div>
