<!doctype html>
<style>
.grid { display: grid; grid: 100px 80px / 50px 50px 50px; align-items: baseline; font-family: monospace; line-height: 1; }
.grid > div { width: 50px; }
.a { grid-row: 1; grid-column: 1; font-size: 20px; }
.b { grid-row: 1; grid-column: 2; font-size: 40px; }
.c { grid-row: 1; grid-column: 3; font-size: 30px; }
.d { grid-row: 2; grid-column: 1; height: 40px; }
.e { grid-row: 2; grid-column: 2; font-size: 20px; }
.f { grid-row: 2; grid-column: 3; height: 20px; align-self: end; }
</style>
<div class="grid"><div class="a">E</div><div class="b">E</div><div class="c">E</div><div class="d"></div><div class="e">E</div><div class="f"></div></div>
