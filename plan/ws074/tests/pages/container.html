<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>container units</title>
<!-- ws074-p075: container-relative units (cqi, cqw, cqh, cqb) against the nearest query container. -->
<style>
body { font-family: sans-serif; font-size: 14px; margin: 8px; }
.c { container-type: inline-size; background: #eee; margin-bottom: 10px; }
.w300 { width: 300px; }
.w500 { width: 500px; }
.half { width: 50cqi; height: 20px; background: #cde; }
.tall { width: 100px; height: 40cqi; background: #fc9; }
.mixed { width: calc(10px + 25cqw); height: max(20px, 5cqi); background: #9c9; }
.grid { display: grid; grid-template-columns: 25cqi 1fr; gap: 4px; }
.grid > div { background: #cce; height: 20px; }
.size { container-type: size; width: 400px; height: 100px; background: #eef; margin-bottom: 10px; }
.cqh { width: 50cqw; height: 50cqh; background: #f99; }
.short { container: card / inline-size; width: 200px; background: #efe; margin-bottom: 10px; }
.nested { container-type: inline-size; width: 50%; background: #ddd; }
.none { width: 10cqi; height: 10px; background: #999; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="c w300"><div class="half"></div><div class="tall"></div><div class="mixed"></div></div>
<div class="c w500"><div class="half"></div><div class="grid"><div>25cqi</div><div>the rest</div></div></div>
<div class="size"><div class="cqh"></div></div>
<div class="short"><div class="half"></div></div>
<div class="c w500"><div class="nested"><div class="half"></div></div></div>
<div class="none"></div>
</body>
</html>
