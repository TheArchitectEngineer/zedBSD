<!DOCTYPE html>
<meta charset="utf-8">
<title>transform: scale on a box with children</title>
<style>
body { margin: 0; font: 20px sans-serif; background: #fff; }
.a { position: absolute; left: 0; top: 0; width: 200px; height: 100px; background: #ccc; border: 4px solid #333; }
.a p { margin: 10px; background: #fc0; }
.s { transform: scale(.5); transform-origin: 0 0; }
.b { position: absolute; left: 300px; top: 0; transform: scale(1.5); transform-origin: 50% 50%; width: 100px; height: 60px; background: #39c; }
.b span { display: block; width: 30px; height: 30px; background: #c33; }
</style>
<div class="a"><p>normal text</p></div>
<div class="a s" style="top:150px"><p>half size text</p></div>
<div class="b"><span></span>big</div>
