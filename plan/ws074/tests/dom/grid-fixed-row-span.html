<!doctype html>
<meta charset="utf-8">
<title>Fixed Grid rows retain their maxima under spanning content</title>
<body>
<script>
function testCase(name, rows, height, gap, childHeight, minimum, frame) {
    var grid = document.createElement("div");
    grid.style.cssText = "display:grid;width:120px;align-content:start;grid-template-columns:30px;grid-template-rows:" + rows + ";row-gap:" + gap + ";height:" + height + ";" + frame;
    var item = document.createElement("div");
    item.style.cssText = "grid-column:1;grid-row:1 / span 2;width:20px;height:" + childHeight + ";min-height:" + minimum;
    if (childHeight === "auto") {
        var content = document.createElement("div");
        content.style.height = "40px";
        item.appendChild(content);
    }
    var marker = document.createElement("div");
    marker.style.cssText = "grid-column:1;grid-row:3;height:0;width:0";
    grid.appendChild(item);
    grid.appendChild(marker);
    document.body.appendChild(grid);
    var style = getComputedStyle(grid);
    var origin = grid.getBoundingClientRect().top + parseFloat(style.borderTopWidth) + parseFloat(style.paddingTop);
    console.log(name, style.gridTemplateRows, "/", marker.getBoundingClientRect().top - origin, "/", item.getBoundingClientRect().height);
}
testCase("fixed", "10px 10px", "120px", "0", "40px", "0", "");
testCase("fixed-gap", "10px 10px", "120px", "5px", "40px", "0", "");
testCase("percent", "10% 20%", "100px", "0", "60px", "0", "");
testCase("border-percent", "10% 20%", "120px", "0", "60px", "0", "box-sizing:border-box;border:5px solid;padding:5px");
testCase("minmax-auto", "minmax(auto,10px) minmax(auto,10px)", "120px", "0", "auto", "12px", "");
testCase("minmax-floor", "minmax(20px,10px) minmax(20px,10px)", "120px", "0", "100px", "0", "");
testCase("mixed-small", "auto 20px", "120px", "0", "10px", "0", "");
</script>
