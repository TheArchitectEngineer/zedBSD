<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Geometry</title>
<style>
body { margin: 0; }
#top { height: 40px; }
#box { margin: 10px 20px; width: 100px; height: 50px; border: 3px solid red; padding: 5px 7px; }
#half { width: 10.5px; height: 20.25px; }
#row { display: flex; }
#row div { width: 30px; height: 10px; }
#place { position: absolute; left: 200px; top: 300px; width: 17px; height: 9px; border-left: 4px solid blue; }
#gone { display: none; }
#sized { box-sizing: border-box; width: 60px; height: 30px; padding: 4px; border: 2px solid; }
#control-row { position: absolute; left: 300px; top: 200px; display: flex; width: 200px; }
#control-field { display: flex; flex: 1 1 0px; box-sizing: border-box; width: 100%; height: 38px; padding: 7px 10px 10px 0; margin: 0; border: 0; font: 15px/15px sans-serif; text-indent: 8px; }
</style>
</head>
<body>
<div id="top"></div>
<div id="box"></div>
<div id="half"></div>
<div id="row"><div id="first"></div><div id="second"></div></div>
<div id="place"></div>
<div id="gone"><div id="inside"></div></div>
<div id="sized"></div>
<div id="control-row"><input id="control-field" type="text" placeholder="Search"></div>
<script>
// ws074-p031: getBoundingClientRect, getClientRects, DOMRect and the client, offset and scroll sizes.
// Only boxes whose place does not depend on the viewport's size or the fonts are measured.
function rect(id) {
  var r = document.getElementById(id).getBoundingClientRect();
  return [r.x, r.y, r.width, r.height, r.top, r.right, r.bottom, r.left].join(" ");
}
function sizes(id) {
  var e = document.getElementById(id);
  return [e.clientWidth, e.clientHeight, e.clientTop, e.clientLeft, e.offsetWidth, e.offsetHeight, e.scrollTop, e.scrollLeft].join(" ");
}
console.log("box", rect("box"), "|", sizes("box"));
console.log("half", rect("half"), "|", sizes("half"));
console.log("row", rect("first"), "|", rect("second"));
console.log("place", rect("place"), "|", sizes("place"));
console.log("gone", rect("gone"), "|", rect("inside"), "|", sizes("gone"));
console.log("sized", rect("sized"), "|", sizes("sized"));
console.log("control", rect("control-field"), "|", sizes("control-field"));
var box = document.getElementById("box");
console.log(box.getClientRects().length, document.getElementById("gone").getClientRects().length, box.getClientRects()[0].width);
var r = box.getBoundingClientRect();
console.log(r instanceof DOMRect, typeof r.toJSON, JSON.stringify(r), Object.keys(r).length);
var made = new DOMRect(1, 2, -3, 4);
console.log(made.left, made.right, made.top, made.bottom);
made.width = 10;
console.log(made.right, JSON.stringify(made.toJSON()));
console.log(window.scrollX, window.scrollY, window.pageXOffset, window.pageYOffset, document.documentElement.scrollTop);
document.getElementById("top").style.height = "80px";
console.log("moved", rect("box"));
var added = document.createElement("div");
added.style.cssText = "width: 25px; height: 5px; margin-left: 3px;";
document.body.insertBefore(added, document.getElementById("top"));
console.log("added", added.getBoundingClientRect().left, added.offsetWidth, rect("box"));
var loose = document.createElement("div");
console.log("loose", loose.getBoundingClientRect().width, loose.getClientRects().length, loose.offsetWidth);
</script>
</body>
</html>
