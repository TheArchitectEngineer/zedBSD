<!doctype html>
<style>
.grid { position: relative; display: grid; width: 250px; height: 450px;
  grid-template-columns: 100px 150px; grid-template-rows: 150px 100px;
  align-content: center; }
.grid > div { width: 20px; height: 10px; }
.auto { position: absolute; grid-row: auto / 1; grid-column: 1 / 2; }
.first { position: absolute; grid-row: 1 / 2; grid-column: 1 / 2; }
.second { position: absolute; grid-row: 2 / auto; grid-column: 1 / 2; }
.flow { grid-row: 1 / 2; grid-column: 2 / 3; }
</style>
<div class="grid"><div class="auto"></div><div class="first"></div><div class="second"></div><div class="flow"></div></div>
