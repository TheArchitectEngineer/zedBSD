<!doctype html>
<style>
.grid { position: relative; display: inline-grid; grid-template-columns: 100px 150px; grid-template-rows: 150px 100px; writing-mode: vertical-lr; font: 10px/1 monospace; }
.grid > div { position: absolute; writing-mode: horizontal-tb; direction: rtl; grid-row: 2 / 3; grid-column: 2 / 3; align-self: end; justify-self: left; left: 5px; top: 10px; }
</style>
<div class="grid" id="grid"><div>XX X<br>X XXX<br>X<br>XX XXX</div></div>
<pre></pre>
<script>
var gridRect = document.getElementById("grid").getBoundingClientRect();
var itemRect = document.querySelector(".grid > div").getBoundingClientRect();
var result = Math.round(itemRect.left - gridRect.left) + "," + Math.round(itemRect.top - gridRect.top) + "," + Math.round(itemRect.width) + "," + Math.round(itemRect.height);
document.querySelector("pre").textContent = result;
console.log(result);
</script>
