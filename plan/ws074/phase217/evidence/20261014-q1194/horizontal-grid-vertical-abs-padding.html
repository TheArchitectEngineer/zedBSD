<!doctype html>
<style>
.grid { position: relative; display: inline-grid; grid-template-columns: 100px 150px; grid-template-rows: 150px 100px; font: 10px/1 monospace; }
#rtl { direction: rtl; }
.grid > div { position: absolute; padding: 5px 10px 15px 20px; }
.grid > :nth-child(1) { writing-mode: vertical-lr; grid-row: 1 / 2; grid-column: 1 / 2; align-self: start; justify-self: right; left: 5px; }
.grid > :nth-child(2) { writing-mode: vertical-rl; grid-row: 1 / 2; grid-column: 2 / 3; align-self: end; justify-self: center; right: 10px; }
.grid > :nth-child(3) { direction: rtl; grid-row: 2 / 3; grid-column: 2 / 3; align-self: end; justify-self: left; left: 5px; top: 10px; }
#ltr > :nth-child(3) { writing-mode: vertical-lr; }
#rtl > :nth-child(3) { writing-mode: vertical-rl; }
</style>
<div class="grid" id="ltr"><div>X XX X</div><div>XX X<br>X XXX X<br>XX XXX</div><div>XX X<br>X XXX<br>X<br>XX XXX</div></div>
<div class="grid" id="rtl"><div>X XX X</div><div>XX X<br>X XXX X<br>XX XXX</div><div>XX X<br>X XXX<br>X<br>XX XXX</div></div>
<pre></pre>
<script>
var values = [];
for (var id of ["ltr", "rtl"]) {
  var gridRect = document.getElementById(id).getBoundingClientRect();
  for (var item of document.getElementById(id).querySelectorAll("div")) {
    var itemRect = item.getBoundingClientRect();
    values.push(Math.round(itemRect.left - gridRect.left) + "," + Math.round(itemRect.top - gridRect.top) + "," + Math.round(itemRect.width) + "," + Math.round(itemRect.height));
  }
}
document.querySelector("pre").textContent = values.join("|");
console.log(values.join("|"));
</script>
