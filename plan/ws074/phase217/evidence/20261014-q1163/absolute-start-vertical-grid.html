<!doctype html>
<meta charset="utf-8">
<style>
.grid { position:relative; display:inline-grid; grid-template-columns:100px 150px; grid-template-rows:150px 100px; font:10px/1 monospace; justify-items:start; align-items:start; }
.grid > div { position:absolute; }
.grid > :nth-child(1) { grid-column:1/2; grid-row:1/2; }
.grid > :nth-child(2) { grid-column:2/3; grid-row:1/2; }
.grid > :nth-child(3) { grid-column:1/2; grid-row:2/3; }
.grid > :nth-child(4) { grid-column:2/3; grid-row:2/3; }
#lr { writing-mode:vertical-lr; }
#rl { writing-mode:vertical-rl; }
</style>
<div id="lr" class="grid"><div>X XX X</div><div>X XX X</div><div>X XX X</div><div>X XX X</div></div>
<div id="rl" class="grid"><div>X XX X</div><div>X XX X</div><div>X XX X</div><div>X XX X</div></div>
<script>
var measures=[];
['lr','rl'].forEach(function(id){
  var grid=document.getElementById(id), origin=grid.getBoundingClientRect();
  var boxes=Array.from(grid.children).map(function(child){
    var rect=child.getBoundingClientRect();
    return [rect.left-origin.left,rect.top-origin.top,rect.width,rect.height].map(Math.round).join(',');
  });
  var result=id+'='+boxes.join('|');measures.push(result);console.log(result);
});
document.body.setAttribute('data-measure',measures.join(';'));
</script>
