<!doctype html>
<style>
.grid { position: relative; display: inline-grid; grid-template-columns: 100px 150px; grid-template-rows: 150px 100px; font: 10px/1 monospace; margin: 4px 2px 8px 3px; padding: 1px 4px 2px 3px; border: solid silver; border-width: 5px 6px 4px 8px; }
.grid > div { position: absolute; writing-mode: vertical-rl; margin: 2px 4px 6px 8px; padding: 3px 2px 4px 5px; border: solid silver; border-width: 1px 6px 2px 3px; grid-row: 1 / 2; grid-column: 2 / 3; align-self: end; justify-self: center; }
#rtl { direction: rtl; }
</style>
<div class="grid" id="ltr"><div>XX X<br>X XXX X<br>XX XXX</div></div>
<div class="grid" id="rtl"><div>XX X<br>X XXX X<br>XX XXX</div></div>
<pre></pre>
<script>
var values = [];
for (var id of ["ltr", "rtl"]) {
  var gridRect = document.getElementById(id).getBoundingClientRect();
  var itemRect = document.getElementById(id).querySelector("div").getBoundingClientRect();
  values.push(Math.round(itemRect.left - gridRect.left) + "," + Math.round(itemRect.top - gridRect.top) + "," + Math.round(itemRect.width) + "," + Math.round(itemRect.height));
}
document.querySelector("pre").textContent = values.join("|");
console.log(values.join("|"));
</script>
