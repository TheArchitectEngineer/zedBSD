<!doctype html>
<div id="sparse" style="display:grid;grid-auto-columns:100px;grid-auto-rows:50px">
  <div>i1</div><div style="grid-column:span 2;grid-row:span 2">i2</div><div>i3</div><div>i4</div>
</div>
<div id="dense" style="display:grid;grid-auto-columns:100px;grid-auto-rows:50px;grid-auto-flow:row dense">
  <div>i1</div><div style="grid-column:span 2;grid-row:span 2">i2</div><div>i3</div><div>i4</div>
</div>
<script>
["sparse", "dense"].forEach(function (id) {
  var grid = document.getElementById(id);
  var origin = grid.getBoundingClientRect();
  var boxes = [];
  Array.from(grid.children).forEach(function (child) {
    var rect = child.getBoundingClientRect();
    boxes.push([Math.round(rect.left - origin.left),
                Math.round(rect.top - origin.top),
                Math.round(rect.width), Math.round(rect.height)].join(","));
  });
  console.log(id + "=" + boxes.join("|"));
});
</script>
