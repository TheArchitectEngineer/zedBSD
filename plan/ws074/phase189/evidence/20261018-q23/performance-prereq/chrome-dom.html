<!DOCTYPE html>
<html><head><meta charset="utf-8"><script>
var before = performance.mark("prior-probe");
console.log("mark-return", before === undefined ? "undefined" : before.entryType + ":" + before.name);
console.log("prior-entry-count", performance.getEntriesByName("prior-probe", "mark").length);
var observed = [];
setTimeout(function () {
    var observer = new PerformanceObserver(function (list) {
        var entries = list.getEntries();
        for (var i = 0; i < entries.length; i++) observed.push(entries[i].name);
    });
    observer.observe({entryTypes:["mark"],buffered:true});
    performance.mark("future-probe");
    setTimeout(function () {
        console.log("future-entry-count", performance.getEntriesByName("future-probe", "mark").length);
        console.log("observed", observed.join(","));
        observer.disconnect();
    },100);
},0);
</script>
</head><body></body></html>
