<!doctype html>
<style>
.grid { display:inline-grid; writing-mode:vertical-lr; grid-template-columns:100px 150px;
        grid-template-rows:150px 100px; font:10px/1 monospace; }
.grid > div { border:1px solid black; writing-mode:horizontal-tb; }
.grid > div:nth-child(1) { grid-column:1; grid-row:1; justify-self:stretch; align-self:start; }
.grid > div:nth-child(2) { grid-column:2; grid-row:1; justify-self:start; align-self:stretch; }
.grid > div:nth-child(3) { grid-column:1; grid-row:2; justify-self:start; align-self:start; }
.grid > div:nth-child(4) { grid-column:2; grid-row:2; justify-self:stretch; align-self:stretch; }
</style>
<div id="empty" class="grid"><div></div><div></div><div></div><div></div></div>
<div id="text" class="grid"><div>X XX X</div><div>X XX X</div><div>X XX X</div><div>X XX X</div></div>
<script>
["empty", "text"].forEach(function (id) {
  var grid = document.getElementById(id);
  var origin = grid.getBoundingClientRect();
  var boxes = Array.from(grid.children).map(function (child) {
    var rect = child.getBoundingClientRect();
    return [Math.round(rect.left - origin.left), Math.round(rect.top - origin.top),
            Math.round(rect.width), Math.round(rect.height)].join(",");
  });
  console.log(id + "=" + Math.round(origin.width) + "," + Math.round(origin.height) + ":" + boxes.join("|"));
});
</script>
