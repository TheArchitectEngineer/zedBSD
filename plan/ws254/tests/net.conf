# ws254-p001: the harness's ue0 by QEMU's DHCP, and ue1, whose DHCP server answers only after a while.
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  ue0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: true
      dhcp-timeout: 20
  ue1:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: true
      dhcp-timeout: 5

dns:
  mode: dhcp
