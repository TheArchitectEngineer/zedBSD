version: 1
hostname: zedbsd

# ws101-p011: G3 on the i915 passthrough of the 5330: the compositor, then the demonstration script and Noct's
# program on the CPU and the GPU (run-g3.sh), then a clean power-off.  The logs are on the disk.
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  zdesktop:
    enabled: true
  wlwait:
    enabled: true
  g3run:
    enabled: true
  poweroff:
    enabled: true
