version: 1
hostname: zedbsd

# ws101-p010: OpenGL ES 3.1's compute on the i915 passthrough of the 5330: the compositor, then glescompute and
# egltest's OpenGL ES 3 scenes in its window (run-gles.sh), then a clean power-off.  The logs are on the disk.
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  zdesktop:
    enabled: true
  wlwait:
    enabled: true
  gles1:
    enabled: true
  poweroff:
    enabled: true
