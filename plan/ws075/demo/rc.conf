version: 1
hostname: kei

services:
  audiod:
    enabled: true
    optional: true
  cron:
    enabled: true
  getty_console:
    enabled: true
  # The graphical login (sessiond, amd64 images with zdesktop).  It stands in
  # for getty_console when the boot parameters say login=graphical and the
  # machine has a display; otherwise it ends at once and getty_console starts.
  # ws075-p013: the demonstration image starts it as greeter_gpu, which first
  # waits for the i915's GPU node (/etc/keiland/greeter-gpu.sh): sessiond
  # gives the console back when /dev/gpu0 is not there yet.
  greeter:
    enabled: false
  greeter_gpu:
    enabled: true
    optional: true
  networkd:
    enabled: true
  networking:
    enabled: true
    settings:
      # Whether the boot waits for an interface to be given an address it
      # can be reached at.  A machine whose next step needs the network
      # says true here; one that does not need not stand still for a
      # server that may not be there.  A link-local address is not one a
      # machine can be reached at, so it does not end the wait.
      wait: "false"
  ntpdate:
    enabled: false
    settings:
      servers: ""
  sshd:
    enabled: true
    optional: true
  syslogd:
    enabled: true
