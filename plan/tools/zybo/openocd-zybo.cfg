# OpenOCD configuration for the original Digilent ZYBO (Zynq-7000 XC7Z010),
# through the board's own FT2232H (channel A is JTAG, channel B is the UART).
#   openocd -f plan/tools/zybo/openocd-zybo.cfg -c 'init; ...; shutdown'
# The upstream target/zynq_7000.cfg is not sourced: it joins both cores with
# "target smp", which would make every halt and resume touch CPU1 in the
# BootROM's wait.  The TAP, DAP and debug-base values below are the upstream
# ones.  This board's PL TAP reads 0x13722093 (version 1; openFPGALoader shows
# it without the version as 0x03722093), hence -ignore-version.
# Values referenced: OpenOCD 0.12.0 tcl/target/zynq_7000.cfg.
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib

source [find interface/ftdi/digilent-hs1.cfg]
adapter serial 210279785182

if {[info exists ::env(JTAG_KHZ)]} {
	adapter speed $::env(JTAG_KHZ)
} else {
	# 15 and 20 MHz load at the same rate (about 255 KiB/s, the USB round
	# trips are the limit); 30 MHz loses the scan chain (p002).
	adapter speed 15000
}

# A scripted run needs no servers; ZYBO_GDB_PORT opens gdb's for analysis.
if {[info exists ::env(ZYBO_GDB_PORT)]} {
	gdb_port $::env(ZYBO_GDB_PORT)
} else {
	gdb_port disabled
}
telnet_port disabled
tcl_port disabled

jtag newtap zynq_pl bs -irlen 6 -ircapture 0x1 -irmask 0x03 \
	-expected-id 0x03722093 -ignore-version
jtag newtap zynq cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
dap create zynq.dap -chain-position zynq.cpu

target create zynq.cpu0 cortex_a -dap zynq.dap -coreid 0 -dbgbase 0x80090000
target create zynq.cpu1 cortex_a -dap zynq.dap -coreid 1 -dbgbase 0x80092000 \
	-defer-examine
# The system bus without halting a core (AP0 is the AHB-AP, p002's probe).
target create zynq.ahb mem_ap -dap zynq.dap -ap-num 0
targets zynq.cpu0
# verify_image's checksum runs on CPU0 here: high OCM below the BootROM's
# wait loop (0xFFFFFF00) and SPL's stack (down from 0xFFFFFE00).
zynq.cpu0 configure -work-area-phys 0xFFFF0000 -work-area-size 0x8000 \
	-work-area-backup 0

# A session cut off by the PS reset in the middle of a DCC transfer (such as
# zybo_ps_reset_via_cpu) leaves CPU0's DBGDSCR in the DCC fast mode, which the
# debug reset domain keeps across the PS reset; every later examine then times
# out.  Put it back to the non-blocking mode before each examine (p002).
proc zybo_dcc_unstick {} {
	zynq.dap apreg 1 0x04 0x80090088
	set dscr [zynq.dap apreg 1 0x0c]
	if {($dscr >> 20) & 3} {
		zynq.dap apreg 1 0x04 0x80090088
		zynq.dap apreg 1 0x0c [expr {$dscr & 0x0000C000}]
		echo [format "zybo: CPU0 DBGDSCR 0x%08x was in DCC fast mode; cleared" $dscr]
	}
}
zynq.cpu0 configure -event examine-start zybo_dcc_unstick

# SLCR registers (Values referenced: U-Boot v2025.07
# arch/arm/mach-zynq/include/mach/hardware.h, slcr.c).
set ZYBO_SLCR_LOCK       0xF8000004
set ZYBO_SLCR_UNLOCK     0xF8000008
set ZYBO_PSS_RST_CTRL    0xF8000200
set ZYBO_FPGA_RST_CTRL   0xF8000240
set ZYBO_BOOT_MODE       0xF800025C
set ZYBO_PSS_IDCODE      0xF8000530
set ZYBO_LVL_SHFTR_EN    0xF8000900
set ZYBO_OCM_CFG         0xF8000910

# Reads one word over the AHB-AP.  Not DDR before SPL has set its controller
# up: such a read hangs the AHB-AP until the next reset (p002).
proc zybo_rd {addr} {
	return [lindex [zynq.ahb read_memory $addr 32 1] 0]
}

# Writes one word over the AHB-AP.
proc zybo_wr {addr value} {
	zynq.ahb write_memory $addr 32 [list $value]
}

# Returns CPU0's pc as a hex string.
proc zybo_pc {} {
	return [format "0x%08x" [dict get [zynq.cpu0 get_reg pc] pc]]
}

# Resets the whole PS (and the PL with it) by writing PSS_RST_CTRL.  The DAP
# goes down with the system, so the write's own error is expected and the
# next operation belongs in a new OpenOCD process.
proc zybo_ps_reset {} {
	global ZYBO_SLCR_UNLOCK ZYBO_PSS_RST_CTRL
	zybo_wr $ZYBO_SLCR_UNLOCK 0xDF0D
	if {[catch {zybo_wr $ZYBO_PSS_RST_CTRL 1} err]} {
		echo "zybo: reset write returned: $err"
	}
	echo "zybo: PS reset requested"
}

# The same reset through CPU0, for when the AHB-AP cannot reach the SLCR.
proc zybo_ps_reset_via_cpu {} {
	global ZYBO_SLCR_UNLOCK ZYBO_PSS_RST_CTRL
	targets zynq.cpu0
	halt
	mww phys $ZYBO_SLCR_UNLOCK 0xDF0D
	catch {mww phys $ZYBO_PSS_RST_CTRL 1}
	echo "zybo: PS reset requested through CPU0"
}

# Fails unless the boot-mode straps say JTAG, so that nothing is loaded over a
# board that is about to boot from its SD card or flash.
proc zybo_check_jtag_mode {} {
	global ZYBO_BOOT_MODE
	set mode [zybo_rd $ZYBO_BOOT_MODE]
	echo [format "zybo: BOOT_MODE 0x%08x" $mode]
	if {($mode & 7) != 0} {
		error "zybo: boot mode is not JTAG"
	}
}

# Loads a binary file at a physical address through CPU0, reads it back, and
# prints the rate.
proc zybo_load {addr file} {
	targets zynq.cpu0
	set start [clock milliseconds]
	load_image $file $addr bin
	set ms [expr {[clock milliseconds] - $start}]
	set size [file size $file]
	echo [format "zybo: loaded %d bytes at 0x%08x in %d ms (%.1f KiB/s)" \
		$size $addr $ms [expr {$size / 1024.0 / ($ms / 1000.0 + 0.001)}]]
	# verify_image fails on the first difference.
	if {[catch {capture {verify_image $file $addr bin}} err]} {
		error "zybo: $file differs at 0x[format %08x $addr]: [string range $err 0 300]"
	}
	echo [format "zybo: verified %d bytes at 0x%08x" $size $addr]
}

# Loads an ELF's PT_LOAD segments at their physical addresses through CPU0
# and reads them back.
proc zybo_load_elf {file} {
	targets zynq.cpu0
	set start [clock milliseconds]
	load_image $file 0 elf
	set ms [expr {[clock milliseconds] - $start}]
	echo [format "zybo: loaded %s (%d bytes of file) in %d ms" $file [file size $file] $ms]
	if {[catch {capture {verify_image $file 0 elf}} err]} {
		error "zybo: $file differs: [string range $err 0 300]"
	}
	echo "zybo: verified $file"
}

# Runs U-Boot SPL from OCM 0x0 and halts it at bp (board_boot_order), after
# it has set up the clocks, MIO, DDR and the UART and printed its banner.
proc zybo_spl {spl_bin bp} {
	targets zynq.cpu0
	halt
	zybo_load 0x0 $spl_bin
	reg cpsr 0x1D3
	arm mcr 15 0 7 5 0 0
	arm mcr 15 0 7 5 6 0
	bp $bp 4 hw
	resume 0x0
	if {[catch {wait_halt 10000} err]} {
		halt
		rbp $bp
		error "zybo: SPL did not reach $bp: pc [zybo_pc]"
	}
	rbp $bp
	echo "zybo: SPL halted at [zybo_pc]"
}

# Enters a loaded kernel the way a Linux-style boot loader would: r0 = 0,
# r1 = no machine ID, r2 = the DTB, SVC mode with interrupts masked, ARM.
proc zybo_enter {entry dtb} {
	targets zynq.cpu0
	reg r0 0
	reg r1 0xFFFFFFFF
	reg r2 $dtb
	reg cpsr 0x1D3
	arm mcr 15 0 7 5 0 0
	arm mcr 15 0 7 5 6 0
	resume $entry
	echo [format "zybo: entered 0x%08x, DTB 0x%08x" $entry $dtb]
}

# Opens the PS-PL level shifters and releases the PL resets, which SPL leaves
# to ps7_post_config just before a jump this flow never makes.
proc zybo_pl_enable {} {
	global ZYBO_SLCR_UNLOCK ZYBO_SLCR_LOCK ZYBO_LVL_SHFTR_EN ZYBO_FPGA_RST_CTRL
	zybo_wr $ZYBO_SLCR_UNLOCK 0xDF0D
	zybo_wr $ZYBO_LVL_SHFTR_EN 0xF
	zybo_wr $ZYBO_FPGA_RST_CTRL 0
	zybo_wr $ZYBO_SLCR_LOCK 0x767B
	echo "zybo: PL level shifters open, PL resets released"
}

# Nothing to print when the file is read.
echo -n ""
