# gpu-perf machine: the AMD RDNA machine (RX 5600 XT) at 10.0.10.3.  Debian 13 is its normal system; zedBSD starts
# once from its NVMe partitions by UEFI BootNext (entry 0004 "zedBSD NVMe") and takes its address by DHCP on the USB
# LAN adapter (found by its MAC on ZEDBSD_SUBNET).  Power: the SwitchBot plug AC276E42B252 (plan/tools.md).
# The programs copied in and the Linux references come from PERF_BUILD (the WS that measures builds them there).
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
ZEDBSD_MAC=${ZEDBSD_MAC:-6c:1f:f7:1a:08:b6}
ZEDBSD_SUBNET=${ZEDBSD_SUBNET:-10.0.30}
ZEDBSD_BOOT=${ZEDBSD_BOOT:-0004}
DEBIAN=${DEBIAN:-awe@10.0.10.3}
GPU_PERF_DRIVER=${GPU_PERF_DRIVER:-amdrdna}
PERF_BUILD=${PERF_BUILD:-build/ws291}
USB_MVIEW=${USB_MVIEW:-$PERF_BUILD/usb/bin/mview}
USB_NGGSHAPE=${USB_NGGSHAPE:-$PERF_BUILD/usb/bin/nggshape}
USB_VKHANG=${USB_VKHANG:-$PERF_BUILD/usb/bin/vkhang}
LINUX_MVIEW=${LINUX_MVIEW:-$PERF_BUILD/linux-mview}
SHOT_REFERENCE=${SHOT_REFERENCE:-$PERF_BUILD/measure/ref}
