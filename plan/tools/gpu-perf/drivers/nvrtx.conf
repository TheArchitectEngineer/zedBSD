# gpu-perf driver: nvrtx (NVIDIA RTX, Turing and later).  It has no status command for the guard yet (DRIVER_STATUS
# prints nothing, so the guard's power checks never trip) and no control program (DRIVER_CTL empty: no logo step).
# Its timing marks are the boot word nvrtx.vk.perf=1 (the counts of the work channel, written every period).
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
DRIVER_STATUS=${DRIVER_STATUS:-"true"}
DRIVER_TIMING_KEY=${DRIVER_TIMING_KEY:-nvrtx.vk.perf}
DRIVER_TIMING_VALUE=${DRIVER_TIMING_VALUE:-1}
DRIVER_CTL=${DRIVER_CTL:-}
