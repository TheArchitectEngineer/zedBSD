# gpu-perf driver: amdrdna (AMD RDNA).  DRIVER_STATUS prints the lines the guard reads every round: one starting
# "power " with the fields hung=0|1, fault=0|1, temp=NC, duty=N% and fan=Nrpm (a driver without one of them leaves it
# out and that check never trips), and any other lines to log with it (here the memory clock's "clocks " line).
# DRIVER_TIMING_KEY is the boot line's key of the driver's timing marks (measure.sh timing, profile) and
# DRIVER_TIMING_VALUE its period; DRIVER_CTL the driver's control program, which the logo step needs (watch, display,
# screen), empty for a driver without one.
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
DRIVER_STATUS=${DRIVER_STATUS:-"amdrdnactl | grep '^power \\|^clocks '"}
DRIVER_TIMING_KEY=${DRIVER_TIMING_KEY:-amdrdna.vk.timing}
DRIVER_TIMING_VALUE=${DRIVER_TIMING_VALUE:-2000}
DRIVER_CTL=${DRIVER_CTL:-amdrdnactl}
