# OpenOCD configuration for the Xilinx KC705's onboard Digilent USB JTAG
# (FT2232H, channel A), for the scans of the FPGA's TAP only (BSCANE2 USER
# registers; loading is openFPGALoader's, jtag-load.sh).  The chain holds the
# XC7K325T alone (openFPGALoader --detect: index 0, idcode 0x3651093 without
# the version), IR 6 bits.
#   openocd -f plan/tools/kc705/openocd-kc705.cfg -c 'init; ...; shutdown'
# Values referenced: OpenOCD 0.12.0 tcl/interface/ftdi/digilent-hs1.cfg (the
# same channel and pins as openFPGALoader's "digilent" cable).
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib

source [find interface/ftdi/digilent-hs1.cfg]
adapter serial 210203368704

if {[info exists ::env(JTAG_KHZ)]} {
	adapter speed $::env(JTAG_KHZ)
} else {
	adapter speed 10000
}
transport select jtag
gdb_port disabled
telnet_port disabled
tcl_port disabled

jtag newtap kc705 fpga -irlen 6 -ircapture 0x1 -irmask 0x03 \
	-expected-id 0x03651093 -ignore-version
