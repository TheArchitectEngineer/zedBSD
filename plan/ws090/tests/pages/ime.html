<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Input method</title>
<style>
body { font-family: sans-serif; font-size: 14px; }
p { margin: 6px 0; }
</style>
</head>
<body>
<p>Name <input id="name" size="20"></p>
<p>Secret <input id="secret" type="password"></p>
<p><textarea id="notes" cols="24" rows="3"></textarea></p>
<script>
var log = function (event) { console.log("input " + event.target.id + " " + event.target.value); };
document.getElementById("name").addEventListener("input", log);
document.getElementById("secret").addEventListener("input", log);
document.getElementById("notes").addEventListener("input", log);
</script>
</body>
</html>
