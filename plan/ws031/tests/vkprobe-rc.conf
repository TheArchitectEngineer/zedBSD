version: 1
hostname: zedbsd

# WS031 E-127: the connectivity probe boots with no network at all (the launcher passes
# -nic none), so the network services are off: they otherwise sit in front of the probe in the
# start order.  The probe itself is a chain of waits and attempts; see plan/ws031/tests.
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  vkprobe1:
    enabled: true
  vkwait2:
    enabled: true
  poweroff:
    enabled: true
