version: 1
hostname: zedbsd

# WS031: the Wayland check on the i915 passthrough.  zwl (the compositor) starts after the
# first wait, then two wltest clients (FIFO, then mailbox with a swapchain recreate) present
# through it; see plan/ws031/tests/vkloop-hw.sh wayland.
services:
  cron:
    enabled: false
  getty_console:
    enabled: true
  net:
    enabled: false
  networkd:
    enabled: false
  ntpdate:
    enabled: false
    settings:
      servers: ""
  syslogd:
    enabled: true
  vkwait1:
    enabled: true
  zwl:
    enabled: true
  wlwait:
    enabled: true
  wltest1:
    enabled: true
  wltest2:
    enabled: true
  vkwait2:
    enabled: true
  poweroff:
    enabled: true
