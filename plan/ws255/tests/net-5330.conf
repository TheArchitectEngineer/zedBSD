# ws255: the Latitude 5330's zedBSD test image, a static IPv4 on its USB 2.5GbE adapter (ue0, usb-cdc-ncm).
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  ue0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 10.0.30.3
          prefix-length: 16

routes:
  - destination: default
    gateway: 10.0.0.1

dns:
  mode: static
  servers:
    - 1.1.1.1
