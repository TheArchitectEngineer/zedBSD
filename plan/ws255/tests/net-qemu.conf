# ws255-p001: the QEMU check: ue0 static on QEMU's user network (no DHCP is used), SSH forwarded to 10.0.2.15.
# Copyright (C) 2026 Awe Morris; SPDX-License-Identifier: Zlib
version: 1

interfaces:
  lo0:
    type: loopback
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 127.0.0.1
          prefix-length: 8
  ue0:
    type: ethernet
    enabled: true
    ipv4:
      dhcp: false
      addresses:
        - address: 10.0.2.15
          prefix-length: 24

routes:
  - destination: default
    gateway: 10.0.2.2

dns:
  mode: static
  servers:
    - 10.0.2.3
